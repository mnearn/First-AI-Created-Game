<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mirror of Self - Extended Boss Edition</title>
    <style>
        body {
            background-color: #121214;
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        #game-container {
            width: 800px;
            background-color: #1a1a1e;
            border: 3px solid #2d2d34;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            box-sizing: border-box;
        }

        header {
            text-align: center;
            border-bottom: 2px solid #3a3a44;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        h1 {
            color: #f1f5f9;
            margin: 0;
            font-size: 28px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255,255,255,0.1);
        }

        .floor-info {
            color: #94a3b8;
            font-size: 14px;
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Layout Grid */
        .game-layout {
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 20px;
        }

        /* Sidebar Panels */
        .panel {
            background-color: #222227;
            border: 1px solid #3a3a44;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .panel-title {
            font-size: 14px;
            font-weight: bold;
            color: #38bdf8;
            text-transform: uppercase;
            margin-bottom: 10px;
            border-bottom: 1px solid #3a3a44;
            padding-bottom: 4px;
        }

        /* Stats & UI Bars */
        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .stat-name {
            color: #94a3b8;
        }

        .stat-val {
            font-weight: bold;
            color: #f8fafc;
        }

        .stat-alloc-btn {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 4px;
            width: 22px;
            height: 22px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .stat-alloc-btn:hover {
            background-color: #7dd3fc;
        }

        .ui-bar-container {
            margin-bottom: 12px;
        }

        .ui-bar-label {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }

        .ui-bar {
            height: 10px;
            background-color: #334155;
            border-radius: 3px;
            overflow: hidden;
        }

        .ui-bar-fill {
            height: 100%;
            width: 100%;
            transition: width 0.1s ease;
        }

        .hp-fill { background-color: #ef4444; }
        .xp-fill { background-color: #22c55e; }
        .boss-hp-fill { background-color: #a855f7; }

        /* Main Canvas/Viewport Area */
        .main-view {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        #game-canvas {
            background-color: #0b0b0d;
            border: 2px solid #3a3a44;
            border-radius: 6px;
            cursor: crosshair;
        }

        /* Screen States */
        .screen-overlay {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            height: 400px;
            background-color: #151518;
            border: 2px solid #3a3a44;
            border-radius: 6px;
        }

        .screen-overlay h2 {
            font-size: 32px;
            margin-bottom: 10px;
            color: #f1f5f9;
        }

        .screen-overlay p {
            color: #94a3b8;
            max-width: 450px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .btn-action {
            background-color: #f59e0b;
            color: #0f172a;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.2s;
        }

        .btn-action:hover {
            background-color: #fbbf24;
        }

        .btn-continue {
            background-color: #22c55e;
        }
        .btn-continue:hover {
            background-color: #4ade80;
        }

        /* Controls Reference List */
        .controls-list {
            padding: 0;
            margin: 0;
            list-style: none;
            font-size: 12px;
            color: #94a3b8;
        }

        .controls-list li {
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }

        .control-key {
            color: #cbd5e1;
            background-color: #334155;
            padding: 1px 5px;
            border-radius: 3px;
            font-family: monospace;
        }

        /* Logger / Feedback */
        #combat-log {
            background-color: #0b0b0d;
            border: 1px solid #3a3a44;
            border-radius: 4px;
            height: 60px;
            padding: 8px;
            font-size: 12px;
            font-family: monospace;
            overflow-y: auto;
            color: #a7f3d0;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div id="game-container">
    <header>
        <h1 id="game-title">MIRROR OF SELF</h1>
        <div class="floor-info" id="location-display">Floor 1 • Level 1/10</div>
    </header>

    <div class="game-layout">
        <!-- LEFT SIDEBAR: HUD & CONTROLS -->
        <aside>
            <div class="panel">
                <div class="panel-title">Character Status</div>
                
                <div class="ui-bar-container">
                    <div class="ui-bar-label"><span>HP</span><span id="hp-text">100/100</span></div>
                    <div class="ui-bar"><div id="hp-bar" class="ui-bar-fill hp-fill"></div></div>
                </div>

                <div class="ui-bar-container">
                    <div class="ui-bar-label"><span>XP</span><span id="xp-text">0/100</span></div>
                    <div class="ui-bar"><div id="xp-bar" class="ui-bar-fill xp-fill"></div></div>
                </div>
                
                <div class="stat-row" style="margin-top: 10px;">
                    <span class="stat-name" style="color:#f59e0b; font-weight:bold;">Essence Points:</span>
                    <span class="stat-val" id="essence-val" style="color:#f59e0b;">0</span>
                </div>
            </div>

            <div class="panel">
                <div class="panel-title">Permanent Stats</div>
                <div class="stat-row">
                    <span class="stat-name">STR (Strength)</span>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <span class="stat-val" id="stat-str">10</span>
                        <button class="stat-alloc-btn hidden" id="alloc-str" onclick="allocateStat('str')">+</button>
                    </div>
                </div>
                <div class="stat-row">
                    <span class="stat-name">DEF (Defense)</span>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <span class="stat-val" id="stat-def">10</span>
                        <button class="stat-alloc-btn hidden" id="alloc-def" onclick="allocateStat('def')">+</button>
                    </div>
                </div>
                <div class="stat-row">
                    <span class="stat-name">SPD (Speed)</span>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <span class="stat-val" id="stat-spd">10</span>
                        <button class="stat-alloc-btn hidden" id="alloc-spd" onclick="allocateStat('spd')">+</button>
                    </div>
                </div>
                <div class="stat-row">
                    <span class="stat-name">ARC (Arcana)</span>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <span class="stat-val" id="stat-arc">10</span>
                        <button class="stat-alloc-btn hidden" id="alloc-arc" onclick="allocateStat('arc')">+</button>
                    </div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-title">Controls</div>
                <ul class="controls-list">
                    <li><span>Move</span><span class="control-key">WASD</span></li>
                    <li><span>Aim</span><span class="control-key">Mouse</span></li>
                    <li><span>Attack</span><span class="control-key">Left Click</span></li>
                    <li><span>Dash</span><span class="control-key">Space</span></li>
                    <li><span>Abilities</span><span class="control-key">1 / 2 / 3</span></li>
