<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Infinite Bloom</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game">
    <h1>Infinite Bloom</h1>

    <div id="turn">Turn: 1 / 60</div>

    <div id="stats">
        <div class="stat">
            <h2>Dhalia</h2>
            <div id="dhalia-hp">HP: 200 / 200</div>
            <div id="dhalia-form">Form: Seed</div>
        </div>

        <div class="stat">
            <h2>Ember</h2>
            <div id="ember-hp">HP: 150 / 150</div>
            <div id="ember-phase">Phase: 1 (Fire)</div>
        </div>
    </div>

    <div id="actions">
        <button id="btn1" onclick="useSkill1()">Skill 1</button>
        <button id="btn2" onclick="useSkill2()">Skill 2</button>
        <button id="btn3" onclick="useSkill3()">Skill 3</button>
        <button id="btn4" onclick="useBlooming()">Blooming (Ult)</button>
    </div>

    <div id="log"></div>
</div>

<script src="game.js"></script>
</body>
</html>
